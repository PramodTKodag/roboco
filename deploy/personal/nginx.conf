# Personal deployment edge. Differences from deploy/nginx.conf, all deliberate:
#   - no panel token is injected and client X-Agent-* identity headers are
#     stripped: the owner session cookie is the only way in;
#   - the Host header keeps its port and must be one of the two local origins;
#     any other Host (DNS rebinding, a stray vhost) is refused;
#   - the panel is served with a restrictive Content-Security-Policy and the
#     usual hardening headers, so a rendered document cannot load remote
#     images, scripts, frames or form targets;
#   - no blue-green include: the three upstreams are fixed service names.
#
# Only 127.0.0.1:3000 is published (see compose.personal.yml); everything else
# stays on internal networks.

server_tokens off;

map $http_host $local_host_allowed {
    default           0;
    "localhost:3000"  1;
    "127.0.0.1:3000"  1;
}

# Anything that is not addressed to the named server below is dropped.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Docker's embedded DNS: upstream names resolve per request, so a service that
    # is briefly down yields a 502 for its routes only, never a dead edge.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $panel_upstream        panel:3000;
    set $orchestrator_upstream orchestrator:8000;
    set $dispatcher_upstream   dispatcher:8000;

    client_max_body_size 1m;

    if ($local_host_allowed = 0) {
        return 421;
    }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location /health {
        proxy_pass http://$orchestrator_upstream;
        include /etc/nginx/personal/nginx-proxy-common.conf;
    }

    location /ready {
        proxy_pass http://$orchestrator_upstream;
        include /etc/nginx/personal/nginx-proxy-common.conf;
    }

    # Fleet-owning routes live on the dispatcher (the only process holding the
    # run registry). Server-sent events need buffering off and a long read.
    location /api/orchestrator/ {
        proxy_pass http://$dispatcher_upstream;
        include /etc/nginx/personal/nginx-proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location /api/secretary/live/ {
        proxy_pass http://$dispatcher_upstream;
        include /etc/nginx/personal/nginx-proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location /api/prompter/live/ {
        proxy_pass http://$dispatcher_upstream;
        include /etc/nginx/personal/nginx-proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://$orchestrator_upstream;
        include /etc/nginx/personal/nginx-proxy-common.conf;
    }

    location /ws/ {
        proxy_pass http://$orchestrator_upstream;
        include /etc/nginx/personal/nginx-proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Scanner fingerprints never reach the panel.
    location ~* "^/(\.env|\.git|\.aws|\.ssh|\.svn|\.hg|wp-login\.php|wp-admin|xmlrpc\.php|phpmyadmin|admin\.php|server-status|actuator|debug/pprof|cgi-bin|vendor/)" {
        return 444;
    }

    location / {
        proxy_pass http://$panel_upstream;
        include /etc/nginx/personal/nginx-proxy-common.conf;
    }
}
