# Headers every proxied location sends upstream (included per location, because
# nginx drops all inherited proxy_set_header values once a location sets one).
#
# Identity is never taken from the browser: the four X-Agent-* headers are blanked
# (an empty value removes the header), and no panel token is injected. The caller
# is the signed-in owner session cookie or nobody.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Agent-Id "";
proxy_set_header X-Agent-Role "";
proxy_set_header X-Agent-Team "";
proxy_set_header X-Agent-Token "";
